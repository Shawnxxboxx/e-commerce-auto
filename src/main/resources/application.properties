spring.application.name=e-commerce-auto

# 本地 MySQL 配置
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/e-commerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 马帮OpenAPI配置
mambang.api.base-url=https://gwapi.mabangerp.com/api/v2
mambang.api.app-key=your_app_key_here
mambang.api.app-secret=your_app_secret_here
mambang.api.version=1

# Playwright CDP 配置（连接到已打开的 Chrome）
playwright.cdp.host=localhost
playwright.cdp.port=9222
playwright.cdp.timeout-ms=30000

spring.datasource.password=123456789
playwright.enabled=false

material.storage.root=${MATERIAL_STORAGE_ROOT:./data/material-packages}
material.storage.max-package-size=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
